[package]
name = "ds-cli"
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.88"
authors = ["hunjixin"]
license = "MIT"
description = "ds-cli is a command line tool to talk with deepseek"
repository = "https://github.com/hunjixin/deepseek-api"
readme = "../README.md"
keywords = ["deepseek", "cli", "rust"]
categories = ["command-line-interface", "command-line-utilities"]

[dependencies]
anyhow="1.0.95"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
ratatui-textarea = "0.9.4"
color-eyre = "0.6.3"
crossterm = "0.29"
textwrap = "0.16"
serde = {version = "1.0.218", features = ["derive"]}
serde_json = "1.0.139"
deepseek-api = {path="../deepseek-api", version = "0.2.0-alpha.1",  default-features=false,  features = ["is_sync"]}
clap = { version = "4.1.11", features = ["derive", "env"] }
