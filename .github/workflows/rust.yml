name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        features: [default, minimal, blocking, all]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Default async
        if: matrix.features == 'default'
        run: cargo test -p deepseek-api --locked
      - name: No default features
        if: matrix.features == 'minimal'
        run: cargo test -p deepseek-api --locked --no-default-features
      - name: Blocking only
        if: matrix.features == 'blocking'
        run: cargo test -p deepseek-api --locked --no-default-features --features blocking
      - uses: dtolnay/rust-toolchain@1.88.0
        if: matrix.features == 'all'
        with:
          components: rustfmt, clippy
      - name: Format
        if: matrix.features == 'all'
        run: |
          cargo fmt --all -- --check
          rustfmt --check --edition 2021 deepseek-api/src/client_builder.rs deepseek-api/src/chat_response.rs
      - name: Entire workspace and both transports
        if: matrix.features == 'all'
        run: cargo test --workspace --locked --all-features
      - name: Lint all targets
        if: matrix.features == 'all'
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - name: Documentation
        if: matrix.features == 'all'
        run: cargo doc -p deepseek-api --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
